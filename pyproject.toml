[project]
name = "roxstar-ai-voice-assistant"
version = "0.2.0"
description = "Two Hindi/Hinglish AI participants (AI Dost and AI Sathi) in a multi-user LiveKit voice room."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents>=1.8,<2.0",
  "livekit-plugins-sarvam>=1.8,<2.0",
  "google-genai>=1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.25,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxstar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
