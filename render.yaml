services:
  # 1. Backend Web Service: Token server on $PORT + LiveKit worker
  - type: web
    name: roxstar-backend
    runtime: python
    buildCommand: pip install -e .
    startCommand: python -m roxstar.server
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # 2. Frontend Static Site: React UI with Vite
  - type: web
    name: roxstar-frontend
    runtime: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: ./web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The browser needs the backend's PUBLIC URL. fromService "host" gives Render's
      # internal hostname (roxstar-backend-fe1e), which browsers cannot resolve.
      - key: VITE_TOKEN_URL
        value: https://roxstar-backend-fe1e.onrender.com
